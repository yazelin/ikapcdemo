[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ikapcdemo"
version = "0.1.0"
description = "Single-shot capture for I-Tek / MORITEX USB3 Vision cameras via the vendor IKapC SDK (library + CLI + web UI), pure stdlib"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yaze Lin", email = "yazelin@ching-tech.com" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/yazelin/ikapcdemo"

[project.scripts]
ikapcdemo = "ikapcdemo.cli:main"

[tool.setuptools.packages.find]
include = ["ikapcdemo*"]

[tool.setuptools.package-data]
ikapcdemo = ["static/*.html"]
